[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giso"
version = "0.1.0"
description = "A tiny runtime that ingests Python capabilities into a live object."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "arthexis"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["giso*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
